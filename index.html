<style>

  * { box-sizing: border-box; }
  body {

    font-family: "Pretendard", "Malgun Gothic", -apple-system, sans-serif;
  }
  header {
    padding: 24px 32px 12px; border-bottom: 1px solid var(--border);

  .chip {

    background: var(--panel); color: var(--muted); cursor: pointer; font-size: 13px; user-select: none;

  .count { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .card {
    border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px;
    margin-bottom: 12px; background: var(--panel);
  }
  .card-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .card-title { font-size: 15px; font-weight: 600; }
  .card-title a { color: var(--text); text-decoration: none; }
  .card-title a:hover { color: var(--accent); text-decoration: underline; }
  .card-date { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .card-summary { color: var(--muted); font-size: 13px; margin: 8px 0; line-height: 1.5; }
  .card-bottom { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; }
  .src { color: var(--muted); }
  .tag { padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .tag.ai { background: rgba(91,140,255,.15); color: var(--tag-ai); }
  .tag.uiux { background: rgba(51,196,141,.15); color: var(--tag-uiux); }
  .tag.law { background: rgba(255,159,67,.15); color: var(--tag-law); }
  .tag.etc { background: rgba(122,130,144,.2); color: var(--tag-etc); }
  .tag.flag { background: rgba(255,209,102,.18); color: var(--flag); }
  .card.flagged { border-left: 3px solid var(--flag); }
  .star { color: var(--flag); margin-right: 4px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .more-btn {
    display: block; margin: 8px auto 0; padding: 9px 20px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    cursor: pointer; font-size: 13px;
  }
  .more-btn:hover { border-color: var(--accent); }
  .limit-note { color: var(--muted); font-size: 12px; margin: 4px 0 12px; }
</style>
</head>

스마트폰 '아이폰 듀오' 공개...329만원부터 시작", "link": "https://www.aitimes.com/news/articleView.html?idxno=215081", "summary": "애플이 아이폰 출시 이후 가장 큰 하드웨어 폼팩터 변화로 꼽히는 첫 폴더블 스마트폰 '아이폰 듀오(iPhone Duo)'를 공개했다. 그동안 폴더블폰의 대표적인 단점으로 지적돼 온 디스플레이 주름과 내구성 문제를 새로운 힌지와 소재 기술로 개선하고, 대화면을 활용한 멀티태스킹을 앞세워 폴더블 시장 공략에 본격적으로 나섰다.애플은 9일(현지시간) 열린 ‘서프라이즈 앤 샤인(Surprise and Shine)’ 행사에서 자사의 첫 폴더블 아이폰 ‘아이폰 듀오(iPhone Duo)’​를 공개했다. 아이폰 듀오는 여권과 비슷한 형태로 접히", "source": "AI타임스", "region": "국내", "published": "2026-09-10 12:01", "published_sort": "2026-09-10T12:01:48+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "[템터뷰] 엑사원에 올라탄 '보안 전문가'...LG CNS \"통신부터 실증\"", "link": "https://www.techm.kr/news/articleView.html?idxno=155083", "summary": "33개 기업과 기관이 모여 830테라바이트(TB) 규모 데이터를 확보하면 글로벌 빅테크의 AI와 겨룰 보안 모델을 만들 수 있을까. LG CNS는 데이터의 양보다 학습에 쓸 수 있는 유효 데이터를 얼마나 빠르게 골라내느냐가 성패를 가를 것으로 보고 있다.정부 '사이버보안 특화 AI 파운데이션 모델' 개발 사업에 참여한 LG CNS는 20년 넘게 축적한 보안관제 경험과 레드·블루팀 실무 역량을 모델 개발에 투입한다. LG AI연구원이 엑사원을 기반으로 공격 역량을 갖춘 모델을 개발하고 LG유플러스가 통신 데이터를 제공한다. LG CN", "source": "테크M", "region": "국내", "published": "2026-09-10 12:00", "published_sort": "2026-09-10T12:00:00+00:00", "collected_at": "2026-09-10 13:38", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "[MMOLite, 이클립스] \"피로감 줄이고, 짬짬이 즐겨야\"...MMO 성공 방정식 바뀐다", "link": "https://www.techm.kr/news/articleView.html?idxno=155073", "summary": "한국 게임을 대표하는 장르인 MMORPG의 성공 방정식이 달라지고 있다. 게임업계를 강타한 '제우스: 오만의 신'이 '모두를 위한 MMORPG'를 표방하며 모두가 즐길 수 있는 경쟁 구도를 만들며 흥행 가도에 올라선데 이어 10일 출시된 '이클립스' 역시 가벼운 MMORPG를 표방하고 나섰다. 긴 플레이 타임과 무한 경쟁으로 대표되는 MMORPG 장르도 '숏폼'과 같은 최근 트렌드에 올라타는 모양새다.스마일게이트는 이날 엔픽셀이 개발한 '이클립스'를 공식 출시했다. '이클립스'가 표방하는 'MMOLite'는 긴 접속시간, 반복적인", "source": "테크M", "region": "국내", "published": "2026-09-10 12:00", "published_sort": "2026-09-10T12:00:00+00:00", "collected_at": "2026-09-10 13:38", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "[MMOLite, 이클립스] 탱커부터 암살, 원딜까지 내 마음대로...정해진 공략 대신 전투 설계 재미 '쏠쏠'", "link": "https://www.techm.kr/news/articleView.html?idxno=155072", "summary": "스마일게이트가 10일 출시한 '이클립스: 더 어웨이크닝'은 기존 MMORPG의 재미를 따르지 않는다. MMORPG에서 캐릭터를 강하게 성장시키고 전투에서 승리하는 것이 핵심 재미 중 하나였다면, 이클립스는 이용자가 직접 전투 방식을 설계하는 재미를 더했다. 높은 전투력을 확보하는 것에 집중하기보다 어떤 무기를 선택하고, 어떤 스킬을 조합하며, 어떤 '권능'을 구성하느냐에 따라 전투 방식 자체가 달라지는 구조를 내세웠다.이클립스의 전투 자유도는 클래스 선택 이후부터 본격적으로 체감할 수 있다. 해당 클래스가 하나의 전투 방식으로 고정", "source": "테크M", "region": "국내", "published": "2026-09-10 12:00", "published_sort": "2026-09-10T12:00:00+00:00", "collected_at": "2026-09-10 13:38", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "[MMOLite, 이클립스] \"매일 접속 부담 줄여요\"...스마일게이트, 플레이 방식을 바꾸다", "link": "https://www.techm.kr/news/articleView.html?idxno=155071", "summary": "MMORPG 장르의 게임을 즐기면 마치 모두가 약속이라도 한 듯 빠지지 않는 요소가 있다. 바로 '성장'을 통한 '경쟁'이다. 성장과 경쟁은 MMORPG의 핵심 재미임과 동시에 이용자들을 '노가다'의 늪으로 빠지게 하는 양날의 검이기도 하다. 하지만 스마일게이트는 '매일 접속해야 한다'는 부담에서 벗어나 성장과 경쟁만을 즐길 수 있는 새로운 방식을 선보였다. 10일 정식 출시한 '이클립스: 더 어웨이크닝'을 통해서다. 스마일게이트는 10일 '이클립스: 더 어웨이크닝'을 정식 출시했다. 핵심 키워드는 'MMOLite'다. 이용자가 게", "source": "테크M", "region": "국내", "published": "2026-09-10 12:00", "published_sort": "2026-09-10T12:00:00+00:00", "collected_at": "2026-09-10 13:38", "tags": ["기타"], "flag": true, "flag_hits": ["정식 출시"]}, {"title": "크라우드웍스, 경남 창원에 '피지컬 AI 허브' 1호 거점 구축", "link": "https://www.aitimes.com/news/articleView.html?idxno=215084", "summary": "크라우드웍스(대표 김광일)는 창원에 '피지컬 AI 허브'를 구축했다고 10일 밝혔다. 정부 주도 제조 AI·로보틱스 밸리 조성이 본격화되는 경남 창원국가산업단지를 중심으로 선제적으로 AI 생태계 입지를 선점한다는 방침이다.첫 지역 거점인 창원 오피스는 경남테크노파크 경남인공지능혁신본부에 마련됐다. ▲경남 지역 제조기업 AI 수요 발굴 및 수주 지원 ▲지자체 피지컬 AI 생태계 참여 ▲지역 기반 산학연 네트워크 확대 등을 추진할 예정이다.창원을 시작으로 울산, 전북 등 주요 제조 밀집 지역으로 피지컬 AI 허브를 확대할 예정이다. 내", "source": "AI타임스", "region": "국내", "published": "2026-09-10 11:57", "published_sort": "2026-09-10T11:57:06+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "AWS, AI 개발 도구 '키로' 무상 지원 확대...국내 대학 3곳 포함", "link": "https://www.aitimes.com/news/articleView.html?idxno=215080", "summary": "아마존웹서비스(AW 09-10T10:59:29+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "[금융★들의 궤적] 신한은행 정상혁 최대 실적…땡겨요·기업금융 '첨병'", "link": "https://www.bloter.net/news/articleView.html?idxno=673242", "summary": "대한민국 금융권을 이끄는 스타(★), CEO의 공적과 미래를 전망합니다.정상혁 신한은행장이 역대 최대 실적을 발판으로 고객기반 확대에 속도를 내고 있다. 여행·배달·퇴직연금 등 일상과 맞닿은 영역에서 고객 접점을 넓히고 확보한 고객과 데이터를 예금·대출·자산관리로 연결하는 전략이다. 기업금융에서도 산업별 전문가와 심사역을 현장에 배치해 고객을 직접 발굴하는 체계를 구축했다.2023년 2월 취임한 정 행장은 2024년 말 연임에 성공해 올해 말 임기가 끝난다. 임기 후반에 제시한 핵심 전략은 고객기반의 수평적 확대와 고객관계의 수직적", "source": "블로터", "region": "국내", "published": "2026-09-10 10:56", "published_sort": "2026-09-10T10:56:59+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "'예금 3% 시대' 다시 왔다…두 달 새 62조원 몰린 은행 정기예금", "link": "https://www.techm.kr/news/articleView.html?idxno=155095", "summary": "시중은행의 정기예금 금리가 다시 오르고 있다. 한국은행의 연이은 기준금리 인상과 시장금리 상승을 반영해 은행들이 수신금리를 끌어올리면서 5대 은행 모두 대표 정기예금 금리가 연 3%대로 올라섰다. 증시 등으로 이동했던 시중자금 일부도 안정적인 이자를 받을 수 있는 은행 예금으로 돌아오는 모습이다.10일 금융권에 따르면 하나은행은 이날부터 대표 상품인 '하나의 정기예금' 1년 만기 금리를 기존 연 3.2%에서 연 3.3%로 0.1%포인트 올렸다. 지난 7월 연 2.9%에서 연 3.2%로 0.3%포인트 인상한 지 두 달 만에 다시 금리", "source": "테크M", "region": "국내", "published": "2026-09-10 10:55", "published_sort": "2026-09-10T10:55:17+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "'관리비 얼마 나왔지?' 밤에도 바로 확인…야놀자 기술, 아파트로 들어왔다", "link": "https://www.techm.kr/news/articleView.html?idxno=155094", "summary": "야놀자가 여행·숙박 현장에서 활용해온 실시간 고객 소통 기술의 적용 영역을 아파트로 넓힌다. 관리사무소 운영시간이 끝난 뒤에도 입주민이 민원을 접수하거나 관리비를 조회하고 방문차량 관련 안내를 받을 수 있도록 한다. 여행 산업을 중심으로 축적한 기업간거래(B2B) 솔루션 기술을 주거 등 일상 영역으로 확장하는 행보다.10일 야놀자그룹에 따르면 엔터프라이즈 솔루션 기술 개발 법인 야놀자넥스트는 실시간 소통 솔루션 '텔라(Tella)'를 주거 플랫폼 기업 트러스테이의 노크타운에 적용한다. 텔라는 노크타운의 '노키AI 24시간 안내서비스", "source": "테크M", "region": "국내", "published": "2026-09-10 10:52", "published_sort": "2026-09-10T10:52:40+00:00", "collected_at": "2026-09-10 12:24", "tags": ["법규/정책", "AI/신기술"], "flag": false, "flag_hits": []}, {"title": "포스코홀딩스, 자회사 두 곳 지분 2조5000억 매각…50% '턱걸이'", "link": "https://www.bloter.net/news/articleView.html?idxno=673257", "summary": "포스코홀딩스가 상장 자회사인 포스코인터내셔널과 포스코DX의 지분을 한 번에 2조5000억원어치 처분하면서 시장의 이목을 끌고 있다. 특히 포스코인터내셔널과 포스코DX에 대한 지분율을 정확히 50% 턱걸이 수준에 맞췄다는 점이 관전 포인트다. 자금 조달과 지배구조의 균형을 두고 많은 고민이 담긴 결정으로 풀이된다.10일 금융감독원 전자공시시스템에 따르면 포스코홀딩스는 최근 시간외 대량매매를 통해 포스코인터내셔널 주식 3643만4963주를 주당 5만5400원에, 포스코DX 주식 2338만5917주를 주당 2만600원에 팔았다.이에 포스", "source": "블로터", "region": "국내", "published": "2026-09-10 10:52", "published_sort": "2026-09-10T10:52:23+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "청라 이전 앞둔 하나금융, 인천과 접점 넓힌다…발달장애 예술가와 통학로 새단장", "link": "https://www.techm.kr/news/articleView.html?idxno=155093", "summary": "하나금융그룹이 그룹 헤드쿼터의 인천 청라 이전을 앞두고 지역사회와의 접점을 넓히고 있다. 취약계층과 소상공인 지원부터 아동 대상 프로그램까지 사회공헌 활동을 확대하는 가운데 이번에는 발달장애인 예술가와 손잡고 초등학교 통학로를 예술 공간으로 바꿨다.10일 금융권에 따르면 하나금융은 지난 9일 인천 서구 봉수초등학교에서 통학로 벽화 조성 봉사활동을 진행했다. 하나금융이 운영하는 발달장애인 미술 공모전 '하나 아트버스' 수상 작가와 그룹 임직원 등 30여명이 참여했다.이번 활동에서 눈에 띄는 점은 단순히 임직원이 학교 담장을 새로 칠하", "source": "테크M", "region": "국내", "published": "2026-09-10 10:50", "published_sort": "2026-09-10T10:50:19+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "'시장 장보기도 배달로'…쿠팡, 청량리 성공모델 전국으로 넓힌다", "link": "https://www.techm.kr/news/articleView.html?idxno=155091", "summary": "쿠팡과 쿠팡이츠가 전통시장의 '디지털 전환' 지원을 전국으로 확대한다. 온라인 판매 경험이 부족한 상인에게 배달앱 입점부터 상품 사진 촬영, 마케팅 전략까지 지원하고 시장 대표 먹거리는 밀키트로 상품화한다. 앞서 서울 청량리시장에서 비슷한 지원을 받은 상인들의 쿠팡이츠 매출이 두 자릿수 증가한 만큼 검증된 지원 모델을 지역 전통시장으로 확산한다는 구상이다.10일 쿠팡에 따르면 쿠팡과 쿠팡이츠는 충북 청주 육거리종합시장을 시작으로 '전통시장 디지털 점프업 동행 프로그램'을 추진한다. 내년 상반기까지 경남 거제 등 다른 지역 전통시장으", "source": "테크M", "region": "국내", "published": "2026-09-10 10:45", "published_sort": "2026-09-10T10:45:05+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "[가비아 M&A] 특위 \"4만8000원 적정성 판단 한계\"…중립 권고", "link": "https://www.bloter.net/news/articleView.html?idxno=673251", "summary": "가비아 특별위원회가 주당 4만8000원에 진행 중인 공개매수에 대해 이사회에 중립 의견을 권고했다. 독립적인 기업가치평가를 확보하지 못해 일반주주에게 적정한 보상을 제공하는 가격인지 판단하기 어렵다는 이유다. 최대주주와 일반주주에게 같은 가격을 제시했더라도 재투자와 경영 참여 기회가 다른 만큼 거래조건이 실질적으로 같다고 볼 수 없다는 점도 짚었다.가비아는 공개매수의 목적과 거래조건·절차의 적정성, 최대주주와 일반주주 간 이해관계를 검토해 이사회에 권고하기 위해 7월30일 특위를 설치했다. 이후 8월27일 이사회 결의를 거쳐 기존", "source": "블로터", "region": "국내", "published": "2026-09-10 10:36", "published_sort": "2026-09-10T10:36:41+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "갤럭시 '수성' vs. 아이폰·샤오미 '공성'...폴더블폰 삼국지 '개전'", "link": "https://www.techm.kr/news/articleView.html?idxno=155089", "summary": "접는(폴더블)폰 시장 쟁탈전이 본격화한다. 애플이 참전했다. 중국 업체도 호시탐탐 시장을 노리고 있다. 폴더블폰 시장을 만든 것은 삼성전자다. 삼성전자가 주도권을 지킬 수 있을지 관심이 모아진다.9일(현지시각) 애플은 폴더블폰 '아이폰 듀오'를 공개했다.애플의 첫 폴더블폰이다. 여권형 인폴딩(안으로 접는) 방식이다. 외부 디스플레이는 5.4인치 내부 디스플레이는 7.6인치다. 애플리케이션프로세서(AP)와 통신칩은 자체 설계했다. AP는 'A20프로'다. 2나노미터(nm) 공정으로 제공했다. 무선 네트워킹은 'N1' 이동통신 모뎀은", "source": "테크M", "region": "국내", "published": "2026-09-10 10:33", "published_sort": "2026-09-10T10:33:47+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "SK하이닉스, 성과급 주식 비중 60→50%로…노사 수정안 마련", "link": "https://www.bloter.net/news/articleView.html?idxno=673250", "summary": "SK하이닉스 노사가 성과급 지급 방식을 일부 조정한 수정 잠정합의안을 마련했다. 성과급의 기본 지급 비율을 기존 현금 40%·주식 60%에서 현금 50%·주식 50%로 변경하고, 구성원이 주식 지급 비중을 최대 100%까지 선택할 수 있도록 선택권을 넓혔다. 현금 비중 높이고 선택권 확대…이연 성과급도 선지급SK하이닉스 노사는 지난 9일 임금·단체협약 수정 잠정합의안을 마련했다고 10일 밝혔다. 노조는 이날 임시대의원대회를 거쳐 오는 15~16일 이틀간 조합원 총투표를 진행할 예정이다.수정 잠정합의안은 기존 잠정합의안의 기본 틀을", "source": "블로터", "region": "국내", "published": "2026-09-10 10:33", "published_sort": "2026-09-10T10:33:26+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "시공테크, 아이스크림에듀 43억 규모 주식 공개매수…\"상폐해소 아니다\"", "link": "https://www.bloter.net/news/articleView.html?idxno=673244", "summary": "전시문화산업 기업 시공테크가 스마트 학습 서비스 '아이스크림 홈런'을 운영 2:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "구글 크롬, 보안 환경 변화에 따라 업데이트 주기 2주로 단축", "link": "https://www.aitimes.com/news/articleView.html?idxno=215051", "summary": "구글이 웹브라우저 ‘크롬(Chrome)’의 정식 버전 업데이트 주기를 기존 4주에서 2주로 단축했다. 새로운 기능과 성능 개선을 더 빠르게 제공하는 동시에 AI를 활용한 보안 위협과 급증하는 취약점에 신속하게 대응하기 위한 조치다. 구글은 8일(현지시간) 데스크톱과 안드로이드, iOS용 ‘크롬 153(Chrome 153)’ 출시를 시작으로 2주 단위의 새로운 업데이트 주기를 공식 적용한다고 밝혔다. 앞서 올해 초 크롬의 출시 주기를 4주에서 2주로 줄이겠다는 계획을 발표한 데 따른 것이다.크롬은 그동안 출시 주기를 지속적으로 단축해", "source": "AI타임스", "region": "국내", "published": "2026-09-09 18:32", "published_sort": "2026-09-09T18:32:46+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "OECD 경고 \"AI에 과제 맡긴 학생들, 성적 1.5년 치 떨어졌다\"", "link": "https://www.aitimes.com/news/articleView.html?idxno=215044", "summary": "AI 챗봇을 학교 과제에 자주 사용하는 학생들이 AI를 거의 사용하지 않는 학생보다 시험 성적이 낮다는 조사 결과가 나왔다. OECD는 AI가 학생들의 학습을 돕는 유용한 도구가 될 수 있지만, 어려운 사고 과정을 AI에 맡기는 ‘인지적 외주화(cognitive offloading)’가 확대되면 오히려 학습 능력과 성취도를 떨어뜨릴 수 있다고 경고했다.8일(현지시간) OECD가 발표한 '국제 학업성취도평가(PISA) 2025' 결과에 따르면, 글쓰기 과제를 위해 AI를 거의 사용하지 않는 학생들의 과학 평균 점수는 509점으로 나타", "source": "AI타임스", "region": "국내", "published": "2026-09-09 18:27", "published_sort": "2026-09-09T18:27:07+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "이재용 회장, 홍라희 여사 삼성전자 주식 1.9兆 매수…지분 1.58%", "link": "https://www.bloter.net/news/articleView.html?idxno=673222", "summary": "이재용 삼성전자 회장이 어머니 홍라희 전 리움미술관장으로부터 약 1조9000억원 규모의 삼성전자 보통주를 장외 매수하기로 했다. 홍 전 관장이 상속세 납부를 위해 금융권으로부터 받은 대출을 상환하기 위해서다.이번 거래는 시장에 방대한 물량이 쏟아져 나오는 오버행(잠재적 매도 물량) 리스크를 사전 차단하기 위해 이재용 회장이 직접 인수자로 나섰다. 1조9000억 장외매수 공시, 지배구조 변동 '無'9일 금융감독원 전자공시시스템에 따르면 이재용 회장은 특수관계인인 홍라희 전 관장으로부터 삼성전자 보통주 718만8793주를 장외 매수할", "source": "블로터", "region": "국내", "published": "2026-09-09 18:20", "published_sort": "2026-09-09T18:20:59+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "Apple’s revamp g": false, "flag_hits": []}, {"title": "심텍, KPCA쇼서 AI 기판 기술 공개…산업부 장관상 포함 '3관왕'", "link": "https://www.bloter.net/news/articleView.html?idxno=673204", "summary": "반도체용 인쇄회로기판(PCB) 기업 심텍이 인공지능(AI) 서버용 차세대 기판 기술을 공개하고 산업통상자원부 장관상을 포함해 3개 부문에서 수상했다. 차세대 메모리 모듈 양산과 반도체 패키징 산업 발전에 기여한 성과를 인정받았다.9일 심텍에 따르면 회사는 이날 인천 송도 컨벤시아에서 개막한 '국제 반도체 기판 및 첨단 패키징 산업전(KPCA 쇼 2026)'에 참가했다. 한국PCB반도체패키징산업협회(KPCA)가 주최하는 이번 행사는 국내외 반도체 패키징 및 차세대 기판 기술을 소개하는 기업 간 거래(B2B) 전시회다.심텍은 이번 전시", "source": "블로터", "region": "국내", "published": "2026-09-09 16:36", "published_sort": "2026-09-09T16:36:40+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "[재계 머니무브] 현대차, 아틀라스 2만5000대 내부 수요…원가 승부", "link": "https://www.bloter.net/news/articleView.html?idxno=673194", "summary": "기업의 전략은 돈이 움직이는 방향에서 드러납니다. 주요 대기업의 투자와 자산 매각, 자본확충, 사업재편 등을 따라가며 자금이 어디로 향하는지 추적합니다. 현대자동차그룹의 휴머노이드 로봇사업이 이제 '얼마나 많이 만들 수 있느냐'보다 '공장 원가를 얼마나 낮출 수 있느냐'를 증명해야 하는 단계까지 왔다. 보스턴다이내믹스의 휴머노이드 로봇 '아틀라스'에 약 2만5000대 규모의 그룹 내부 수요가 예상되면서 초기 생산량 확보에는 유리한 위치에 섰다. 다만 내부 도입이 곧 투자 성과를 뜻하는 것은 아니다.현대차그룹이 풀어야 할 과제는 대량", "source": "블로터", "region": "국내", "published": "2026-09-09 16:35", "published_sort": "2026-09-09T16:35:14+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "Google's AI genome system evaluates every possible one-base change", "link": "https://arstechnica.com/science/2026/09/googles-ai-genome-system-evaluates-every-possible-one-base-change/", "summary": "Most one-base changes to the human genome do nothing, but a few are significant.", "source": "Ars Technica", "region": "해외", "published": "2026-09-09 16:34", "published_sort": "2026-09-09T16:34:18+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "[이사회 권력지도] 효성중공업, 오너 회장과 경영위 ‘업무집행권’ 분리", "link": "https://www.bloter.net/news/articleView.html?idxno=673201", "summary": "개정 상법으로 이사회 재편 요구가 커진 가운데 기업들의 대응을 살펴봅니다. 효성중공업은 조현준 효성 oying AI systems that are more capable than&#160;humans", "source": "TechCrunch", "region": "해외", "published": "2026-09-09 16:05", "published_sort": "2026-09-09T16:05:35+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "[AI 대전환 리딩 전략] 포스코퓨처엠, AI 전력수요 LFP로 승부", "link": "https://www.bloter.net/news/articleView.html?idxno=673127", "summary": "포스코퓨처엠이 AI(인공지능) 데이터센터 확산으로 급증하는 전력 수요를 겨냥해 LFP(리튬·인산·철) 양극재 사업을 키운다. 데이터센터 내 ESS(에너지저장장치) 설치가 늘면서 가격 경쟁력과 긴 수명을 갖춘 LFP 수요가 함께 커진 영향이다. 회사는 기존 전기차 생산라인 일부를 LFP용으로 전환하고 전용공장까지 짓는 등 공급 기반 확대에 나섰다. AI가 키운 ESS 특수, LFP로 '틈새 공략' 포스코퓨처엠의 새 먹거리인 LFP 사업이 본궤도에 오르고 있다. 회사는 지난달 국내 유력 배터리 업체와 내년부터 2032년까지 6년간 LF", "source": "블로터", "region": "국내", "published": "2026-09-09 15:55", "published_sort": "2026-09-09T15:55:26+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "광양경자청, 1조원대 투자 협약 체결…에너지·방산 등 미래 산업 전환 가속", "link": "https://www.aitimes.com/news/articleView.html?idxno=215069", "summary": "광양만권경제자유구역청(청장 구충곤)은 9일 에너지·해상풍력·방산 등 미래 산업 분야 4개사와 1조655억원의 투자 협약을 체결했다고 밝혔다.이번 투자 협약은 ‘전남광주통합특별시 시대, 광양만권 외자유치의 새로운 기회’를 주제로 여수 소노캄호텔 그랜드볼룸에서 열린‘광양만권 외국인 투자유치 활성화 포럼 및 투자 협약식’에서 진행됐다.민형배 전남광주통합특별시장, 구충곤 광양경자청장, 서영학 여수시장, 손훈모 순천시장, 박성현 광양시장이 참석했으며, 기업 측에서는 쉬린 CGN율촌전력 회장, 송주호 CGN율촌전력 대표, 김덕한 EEW KHP", "source": "AI타임스", "region": "국내", "published": "2026-09-09 15:55", "published_sort": "2026-09-09T15:55:00+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "구글 클라우드-액센츄어, 현장 파견 AI 엔지니어 전담 조직 신설", "link": "https://www.aitimes.com/news/articleView.html?idxno=215040", "summary": "구글 클라우드와 액센츄어가 기업 고객의 AI 도입과 실제 업무 적용을 지원하기 위해 현장 파견형 AI 엔지니어(FDE) 전담 조직을 신설한다. 기업 내부에 엔지니어를 직접 배치해 업무 프로세스를 분석하고 맞춤형 AI 애플리케이션을 구축하는 방식으로, AI 모델 자체보다 실제 기업 환경에 이를 구현하는 ‘AI 도입·구축’ 시장을 겨냥한 행보다.구글 클라우드와 액센츄어는 8일(현지시간) 액센츄어 산하에 ‘액센츄어 제미나이 엔터프라이즈 비즈니스 그룹(Accenture Gemini Enterprise Business Group)’을 출범시", "source": "AI타임스", "region": "국내", "published": "2026-09-09 15:47", "published_sort": "2026-09-09T15:47:44+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "KAIST 교원창업기업 파네시아, 메타와 ‘차세대 AI 데이터센터 구조’ 제시", "link": "https://www.aitimes.com/news/articleView.html?idxno=215052", "summary": "한국과학기술원(KAIST, 총장 배충식)은 정명수 전기및전자공학부 교수와 팹리스 전문 파네시아가 메타 연구진과 공동 연구한 ‘차세대 AI 데이터센터 구조 제시’ 리뷰 논문이 네이처 리뷰 일렉트리컬 엔지니어링(NREE)에 게재됐다고 9일 밝혔다. 파네시아는 KAIST의 교원창업기업이다. 이번 메타 연구진과의 공동 연구를 통해 CPU, AI가속기, 메모리를 하나로 묶는 차세대 데이터센터 구조를 제시했다. 기존 데이터센터는 여러 컴퓨터가 네트워크를 통해 협업하는 방식이지만, 이번 구조는 서버 간 경계를 낮춰 CPU, 가속기, 메모리를 긴", "source": "AI타임스", "region": "국내", "published": "2026-09-09 15:27", "published_sort": "2026-09-09T15:27:27+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "KAIST, 파리 사클레대학교와 첨단 기술 연구협력 강화", "link": "https://www.aitimes.com/news/articleView.html?idxno=215054", "summary": "한국과학기술원(KAIST, 총장 배충식)은 과학기술특성화대학 연합체 K-STAR를 대표해 프랑스 파리 사클레 대학교와 연구협력 강화를 위한 MOU를 체결했다고 9일 밝혔다. 이번 협약은 이재명 대통령의 프랑스 국빈 방문을 계기로 마련됐다. 지난 4월 서울에서 열린 제9차 한-불 과학기술공동위원회 논의 사항의 연장선이다. K-STAR와 프랑스 대학 간 과학기술 및 인재 교류 확대 방안을 구체화한 것이다. 파리 사클레대는 프랑스를 대표하는 연구중심대학으로, 수학, 물리학 등 기초과학부터 AI, 양자기술, 바이오, 공학에 이르기까지 넓은", "source": "AI타임스", "region": "국내", "published": "2026-09-09 15:24", "published_sort": "2026-09-09T15:24:57+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "[코스닥 루키즈 점검] 메쥬, 흑전에도 공모가 아래…美병원 POC 기대", "link": "https://www.bloter.net/news/articleView.html?idxno=673185", "summary": "웨어러블 환자 모니터링 기업 메쥬가 코스닥 상장 첫해부터 예상보다 빠른 수익성 개선을 이뤄내고 있다. 올해 상반기 매출이 지난해 연간 실적을 넘어선 데 이어 영업이익과 영업현금흐름도 동시에 흑자로 돌아섰다. 다만 주가는 공모가를 40% 넘게 밑돌고 있어, 실적 성과를 지속적으로 이어가면서 시장의 평가를 되돌릴 수 있을지가 관건으로 떠올랐다. 주력 사업 호황…현금흐름도 개선메쥬는 웨어러블 패치형 환자감시장치 시리즈와 병원용 중앙 모니터링 소프트웨어를 기반으로 원격 환자 모니터링과 홀터 심전도 검사 사업을 영위하는 디지털 헬스케어 기업", "source": "블로터", "region": "국내", "published": "2026-09-09 15:24", "published_sort": "2026-09-09T15:24:18+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "KT, ‘지니 TV 셋톱박스 A2’ 출시…“AI로 원하는 콘텐츠 찾는다”", "link": "https://www.aitimes.com/news/articleView.html?idxno=215055", "summary": "KT(대표 박윤영)는 지니 TV의 핵심 AI 기능을 콤팩트한 디자인에 담아내고 이용 부담을 낮춘 ‘지니 TV 셋톱박스 A2’를 출시했다고 9일 밝혔다.이번 ‘지니 TV 셋톱박스 A2’는 대형언어모델(LLM) 중심의 AI 에이전트를 적용해 AI와 대화하듯 원하는 콘텐츠를 찾을 수 있는 것이 특징이다. 정확한 제목이 떠오르지 않아도 내용이나 출연자, 분위기 등을 설명하면 원하는 콘텐츠를 찾아주고, 시청 중 궁금한 내용도 바로 확인할 수 있다.콘텐츠를 시청할 때는 AI가 시청 환경을 알아서 최적화한다. AI SR(Super Resolut", "source": "AI타임스", "region": "국내", "published": "2026-09-09 15:23", "published_sort": "2026-09-09T15:23:10+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술", "UI/UX"], "flag": false, "flag_hits": []}, {"title": "티빙, 개인정보 유출 민사 부담 커진다...한 소송서만 420억원 청구", "link": "https://www.techm.kr/news/articleView.html?idxno=155064", "summary": "고객 개인정보 유출로 고개를 숙인 티빙에 후폭풍이 닥칠 전망이다. 사고 소식이 알려진 직후 시작된 손해배상 소송 참여자가 확대되고 있다. 법무법인 한 곳을 통해 소송에 참여한 피해자만 14만명을 넘어섰다. 이들이 청구한 위자료는 1인당 30만원이다. 전액이 인정되면 청구 규모는 420억원을 상회한다.법무법인 지향은 지난 4일 개인정보 유출 집단소송 네이버 카페를 통해 티빙을 상대로 한 손해배상 청구 소송에 참여할 인원을 오는 28일까지 추가 모집한다고 밝혔다. 지난달 마친 원고 모집 절차를 과학기술정보통신부 민관합동조사단의 조사 결", "source": "테크M", "region": "국내", "published": "2026-09-09 15:15", "published_sort": "2026-09-09T15:15:21+00:00", "collected_at": "2026-09-10 12:24", "tags": ["법규/정책"], "flag": false, "flag_hits": []}, {"title": "영풍·MBK \"고려아연 이사회 진입 7명으로 늘어…감사위원 낙선 유감\"", "link": "https://www.bloter.net/news/articleView.html?idxno=673190", "summary": "고려아연 최대주주인 영풍·MBK파트너스는 9일 열린 임시주주총회를 통해 자신들이 추천해 이사회에 들어간 이사가 기존 5명에서 7명으로 늘었다고 전했다. 다만 분리선출 방식으로 선임된 감사위원에 최윤범 회장 측 인사가 뽑힌 점에 대해서는 유감을 표명했다.영풍·MBK는 이날 임시주총 종료 직후 발표한 입장문을 통해 \"﻿이번 선임으로 우리 측이 추천해 이사회에 진입한 이사는 총 7명으로 늘어났다\"며 \"전문성과 독립적 판단을 바탕으로 이사회의 견제·감시 기능을 충실히 수행하라는 주주들의 기대에 부응하겠다\"고 밝혔다.이어 \"﻿이번 선임으로", "source": "블로터", "region": "국내", "published": "2026-09-09 15:12", "published_sort": "2026-09-09T15:12:57+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "[고려아연 주총] 3% 룰보다 강했던 최윤범 ‘우호지분’", "link": "https://www.bloter.net/news/articleView.html?idxno=673191", "summary": "9월 고려아연 임시 주주총회는 최윤범 회장 측을 지지하는 이른바 '콘크리트 지분'의 힘이 다시 한번 확인된 자리로 평가된다. 특히 개정 상법에 따라 강화된 ‘3% 룰’이 적용되면서 대주주 측 의결권이 제한됐고 최 회장 역시 영풍과의 특수관계에 따라 일부 지분이 묶이면서 당초 예상보다 복잡한 표 계산이 이뤄졌다. 하지만 분리선출 감사위원 1자리는 고려아연 측이 추천한 후보에게 돌아갔다. 최 회장 측 우호지분이 다시 한번 결집력을 보여준 사례라는 평가가 나온다. 81.8% 찬성으로 확인된 최윤범의 승리9일 서울 용산구 몬드리안호텔 그랜", "source": "블로터", "region": "국내", "published": "2026-09-09 15:11", "published_sort": "2026-09-09T15:11:42+00:00", "collected_at": "2026-09-10 12:24", "tags": ["법규/정책"], "flag": false, "flag_hits": []}, {"title": "'IFA 2026' 폐막...삼성전자 '따로 또 같이' vs. LG전자 'B2B 강화'", "link": "https://www.techm.kr/news/articleView.html?idxno=155063", "summary": "'IFA 2026'이 폐막했다. IFA는 하반기 최대 정보통신기술(ICT) 전시회다. 독일 베를린에서 4일부터 8일까지(현지시각) 진행했다.올해는 51개국에서 2000개 이상 업체가 참가했다. 155개국에서 24만명이 방문했다. 역대 최대다. 삼성전자와 LG전자는 'IFA 혁신상'에 이름을 올렸다. 그러나 국내 업체가 IFA를 대하는 방식은 변했다. 삼성전자는 IFA 대신 독자 전시회를 열었다. IFA는 개인(B2C) 소통의 장으로 삼았다. LG전자는 IFA를 떠나지 않았지만 기업(B2B) 상담으로 무게 중심을 옮겼다.라이프 린드너", "source": "테크M", "region": "국내", "published": "2026-09-09 15:11", "published_sort": "2026-09-09T15:11:40+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "법원 “권혁빈, 배우자에 주식 2.5조·현금 650억 지급”", "link": "https://www.bloter.net/news/articleView.html?idxno=673189", "summary": "권혁빈 스마일게이트 창업자 겸 최고비전제시책임자(CVO)가 배우자에게 2조5000억원 상당의 스마일게이트 주식과 현금 650억원을 재산분할로 지급하라는 법원 판단이 나왔다.서울가정법원 가사합의3부는 9일 권 CVO의 배우자 이모씨가 제기한 이혼 및 재산분할 소송에서 두 사람이 이혼하고 권 CVO가 이씨에게 스마일게이트 주식 35%와 현금 650억원을 지급하라고 판결했다. 2022년 11월 소송이 제기된 지 약 4년 만에 나온 1심 판결이다.재판부는 두 사람의 혼인 관계가 회복하기 어려울 정도로 파탄에 이르렀으며 양측의 책임 정도가", "source": "블로터", "region": "국내", "published": "2026-09-09 15:10", "published_sort": "2026-09-09T15:10:47+00:00", "collected_at": "2026-09-10 12:24", "tags": ["법규/정책"], "flag": false, "flag_hits": []}, {"title": "신한라이프, 2년새 금융배출 31% 줄였다…잇단 녹색대출 성과", "link": "https://www.bloter.net/news/articleView.html?idxno=673183", "summary": "신한라이프의 금융배출량이 2년 새 30% 넘게 줄었다. 석탄·석유·액화천연가스(LNG) 등 고탄소 업종에 대한 익스포저를 축소하고 녹색대출을 확대하면서다. 금융배출량 집약도까지 함께 낮아지면서 단순한 투자 규모 변화보다는 자산 포트폴리오의 탄소집약도를 낮추는 방식을 택했다.※금융배출량: 보험사가 직접 배출하는 온실가스가 아닌 투자·대출한 기업의 탄소배출량 중 금융사가 간접적으로 기여한 부분을 산정한 지표. 금융권 공통 감축 목표나 업계 평균 수치가 정해진 지표는 아니지만 금융기관의 기후 리스크 관리 수준을 보여주는 핵심 지표로 활용", "source": "블로터", "region": "국내", "published": "2026-09-09 15:07", "published_sort": "2026-09-09T15:07:27+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "'포스트 소버린 AI' 제언...\"GPU·모델 많다고 AI 강국 아니다\"", "link": "https://www.aitimes.com/news/articleView.html?idxno=215048", "summary": "단순한 AI 기술 확보를 넘어 국내 주요 산업과의 결합을 통한 실질적 성과 창출을 강조하는 '포스트 소버린 AI' 3단계 국가전략이 제시됐다. AI 인프라 보유 자체보다 기업의 생산성 향상과 민간 AX 전환이 핵심이라는 제언이다.포티투마루(42Maru, 대표 김동환)는 9일 서울 대한상공회의소에서 열린 '2026 제3차 글로벌 디지털 포럼'에서 포스트 소버린 AI 국가전략을 발표했다.정보세계정치학회(KAWPI)와 서울대학교 미래전연구센터가 공동 주최한 이번 포럼에서 김동환 대표는 '한국 산업은 AI를 활용해 세계에서 가장 빠르게 혁", "source": "AI타임스", "region": "국내", "published": "2026-09-09 15:04", "published_sort": "2026-09-09T15:04:36+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "[무빙카드 열풍]① 하나카드 '게이미피케이션'…하루 단위 혜택 열었다", "link": "https://www.bloter.net/news/articleView.html?idxno=673182", "summary": "하나카드가 3년6개월 만에 내놓은 신상품 '무빙카드'가 돌풍을 일으키고 있다. 카드 실적 산정의 기준을 기존 월(月) 단위에서 일(日) 단위로 전환한 혁신적 시도에 소비자들이 열광하고 있다. 특히 철저히 수동적이었던 결제 활동과 혜택 적용 과정에 '게이미피케이션(Gamification·게임화)' 요소를 도입하며 일상적 몰입도를 높인 점은 무빙카드가 가진 강력한 무기로 꼽힌다. 9일 하나카드에 따르면 무빙카드는 7월 출시 이후 두 달여 만에 누적 발급 6만장을 돌파했다. 한 달 누적 기준 2만5000장을 기록한 데 이어 증가 폭을 확", "source": "블로터", "region": "국내", "published": "2026-09-09 15:00", "published_sort": "2026-09-09T15:00:00+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "권혁빈 스마일게이트, 1심서 이혼 판결...배우자 위자료 청구 기각, 재산분할 2.5조", "link": "https://www.techm.kr/news/articleView.html?idxno=155062", "summary": "권혁빈 스마일게이트 창업자겸 최고비 source": "테크M", "region": "국내", "published": "2026-09-09 14:02", "published_sort": "2026-09-09T14:02:15+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "강남 누빈 카카오모빌리티 자율주행차...'기술·플랫폼' 투트랙으로 상용화 속도 낸다", "link": "https://www.techm.kr/news/articleView.html?idxno=155053", "summary": "카카오모빌리티가 강남에서 쌓아온 실주행 데이터를 기반으로 기술을 고도화해 자율주행차량 상용화에 속도를 낸다. 이를 위해 인공지능(AI)이 주행 과정을 학습하는 엔드투엔드(E2E) 모델에 규칙 기반 방식을 결합해 기술력을 끌어올리고, 레벨4 진입을 위한 모빌리티 플랫폼과 통합 관제 시스템까지 구축한다. 자율주행 기술 개발부터 호출·승하차, 운행 관제와 현장 대응까지 아우르는 생태계를 구축해 자율주행 서비스를 일상적인 이동수단으로 확장한다는 구상이다.9일 카카오모빌리티는 '도심 자율주행의 완성: 자율주행 기술 및 통합 플랫폼 전략'을", "source": "테크M", "region": "국내", "published": "2026-09-09 14:00", "published_sort": "2026-09-09T14:00:19+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "\"습한 욕실 옛말\"…LG전자, 퓨리케어바스에어시스템으로 욕실가전 승부수", "link": "https://www.bloter.net/news/articleView.html?idxno=673004", "summary": "낮과 밤의 기온차가 커지고 환절기 특유의 기온·습도 변화가 가시화되면서 집안에서 가장 습기에 취약한 구역인 욕실 관리 가전에 대한 소비자 수요가 커지고 있다.최근의 주거 공간은 구조 특성상 욕실에 창문이 설치되지 않은 아파트나 다세대 주택이 많아 자연 환기가 어려운 것이 현실이다. 샤워 후 발생하는 고온 다습한 수증기가 오랜 시간 머물면서 물때와 곰팡이가 번식하고 불쾌한 악취가 쉽게 사라지지 않는 등 일상생활에 불편함을 가중시킨다.LG전자는 주거 환경 변화에 따른 소비자 불편사항에 주목해 단순한 환풍 수준에 머물던 기존 욕실 환풍기", "source": "블로터", "region": "국내", "published": "2026-09-09 14:00", "published_sort": "2026-09-09T14:00:00+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "'메이플스토리 N' 기반 온체인 경제 순항...상반기 수익 3098만 NXPC 기록", "link": "https://www.techm.kr/news/articleView.html?idxno=155046", "summary": "메이플스토리 유니버스가 올해 상반기 약 3098만NXPC 규모의 수익을 창출하며 온체인 경제 생태계의 성장세를 이어간 것으로 나타났다. 생태계가 거둔 수익이 '메이플스토리 N' 이용자들에게 플레이 보상으로 분배된 NXPC 규모를 상회한 것으로 나타나면서 수익과 보상 간 선순환 구조가 본격화되고 있다는 평가다.넥스페이스는 9일 메이플스토리 유니버스 생태계의 온체인 경제 현황을 담은 '2026년 상반기 보고서'를 공개했다.보고서에 따르면 메이플스토리 유니버스는 올해 상반기 약 3098만NXPC의 프로토콜 수익을 기록했다. 같은 기간 블", "source": "테크M", "region": "국내", "published": "2026-09-09 14:00", "published_sort": "2026-09-09T14:00:00+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "NOAA is putting commercial fishing ahead of conservation", "link": "https://arstechnica.com/science/2026/09/noaa-is-putting-commercial-fishing-ahead-of-conservation/", "summary": "Critics say the new agenda could weaken science-based rules and marine protections.", "source": "Ars Technica", "region": "해외", "published": "2026-09-09 13:58", "published_sort": "2026-09-09T13:58:44+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "주요 개발사, 애플의 '시리 AI' 도입에 미온적…생태계 확장 난항", "link": "https://www.aitimes.com/news/articleView.html?idxno=215046", "summary": "애플이 대대적인 개편을 예고한 차세대 AI 음성 비서 '시리 AI'가 주요 빅테크와 앱 개발자들의 협력 부재로 초기 확장에 차질을 빚고 있다. 뉴욕타임스(NYT)는 8일(현지시간) 정식 출시를 앞둔 애플의 시리 AI 시스템에 구글, 메타, 아마존 등 대형 기술 기업의 주요 서비스 연동이 여전히 이뤄지지 않았다고 보도했다.애플은 지난 6월 개발자 회의(WWDC)에서 사용자를 대신해 앱을 직접 제어하고 기기 내 이메일이나 메시지 등 개인화된 맥락을 이해하며 화면 상의 콘텐츠를 인식해 작업을 처리하는 에이전트형 시리를 공개했다. 시리 A", "source": "AI타임스", "region": "국내", "published": "2026-09-09 13:52", "published_sort": "2026-09-09T13:52:46+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": true, "flag_hits": ["정식 출시"]}, {"title": "출범 두 달 만에 DEX 거래 70조원…로빈후드 체인 '폭풍 성장'", "link": "https://www.techm.kr/news/articleView.html?idxno=155056", "summary": "미국 증권거래 플랫폼 로빈후드가 자체 블록체인 '로빈후드 체인'을 새로운 성장축으로 키우고 있다. 메인넷을 가동한 지 두 달여 만에 탈중앙화거래소(DEX) 누적 거래량이 500억달러를 넘어섰고 네트워크에서 발생하는 수수료도 빠르게 불어나고 있다. 증권 중개에 머물던 로빈후드가 주식 토큰과 가상자산, 탈중앙화금융(DeFi)을 자체 블록체인 안으로 끌어들이면서 '금융 인프라 사업자'로 영역을 넓히고 있다는 분석이 나온다.9일 가상자산업계에 따르면 로빈후드 체인의 누적 DEX 거래량은 최근 500억달러(약 70조원)를 넘어섰다. 번스타인", "source": "테크M", "region": "국내", "published": "2026-09-09 13:38", "published_sort": "2026-09-09T13:38:38+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "'세균 득실' 변기 내부…“물 내릴 때 뚜껑 안 닫으면 호흡기로 침투”", "link": "https://www.etnews.com/20260909000369", "summary": "변기 물 이트와 서비스를 직접 이용해 복잡한 작업을 수행하는 소비자용 AI 에이전트 ‘뮤즈(Muse)’를 공개했다. 이전에 내부 코드명 '해치(Hatch)'로 알려진 뮤즈는 최신 모델 ‘뮤즈 스파크(Muse Spark) 1.3’", "source": "AI타임스", "region": "국내", "published": "2026-09-09 12:45", "published_sort": "2026-09-09T12:45:35+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "카카오, AI 영상 생성 연산 비용 대폭 줄이는 적응형 토큰화 기술 'KATok' 공개", "link": "https://www.aitimes.com/news/articleView.html?idxno=215036", "summary": "카카오가 컴퓨터 비전 분야의 '유럽 컴퓨터 비전 학회(ECCV) 2026'에서 AI 영상 생성 모델의 난제로 꼽혀 온 방대한 연산량과 높은 계산 비용 문제를 해결하기 위한 신기술을 발표한다고 9일 밝혔다.ECCV는 CVPR(컴퓨터 비전 및 패턴 인식 학회), ICCV(국제 컴퓨터 비전 학회)와 함께 세계 3대 컴퓨터 비전 학회로, 올해는 오는 12일까지 스웨덴에서 개최된다. 이번 연구를 주도한 이연경 카카오 리서치 엔지니어가 학회에 참여해, 10일 포스터 세션2에서 직접 논문 발표에 나선다.고해상도·장시간 비디오 생성으로 연구 흐름", "source": "AI타임스", "region": "국내", "published": "2026-09-09 12:36", "published_sort": "2026-09-09T12:36:33+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "래블업, 기술 컨퍼런스 ‘lab | up > /conf/6’ 개최…“AI산업 시대의 엔드투엔드”", "link": "https://www.aitimes.com/news/articleView.html?idxno=215035", "summary": "AI 인프라 관리 전문 래블업(대표 신정규)은 오는 29일 서울 삼성동 코엑스 3층 컨퍼런스룸에서 연례 기술 컨퍼런스 ‘lab | up > /conf/6’를 개최한다고 밝혔다.올해로 6회째를 맞는 컨퍼런스로 래블업의 AI 인프라 기술과 연구개발 성과를 공유하는 자리다. AI 업계의 기업 관계자와 개발자들이 기술적 과제와 해결 방안을 논의하기 위한 것이다. 2021년 온라인으로 처음 시작된 이후 매년 AI 산업의 주요 기술 변화에 맞춰 주제를 확장해 왔다.올해 컨퍼런스의 주제는 ‘Make AI Composable²(AI를 조립 가능하", "source": "AI타임스", "region": "국내", "published": "2026-09-09 12:33", "published_sort": "2026-09-09T12:33:40+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "[테크M 트렌드] \"내일 입어야 하는데\"...패션 플랫폼도 '빠른배송' 경쟁", "link": "https://www.techm.kr/news/articleView.html?idxno=155054", "summary": "패션 플랫폼들이 빠른배송 경쟁에 속도를 내고 있다. 다음 날 입을 옷이나 여행을 앞두고 필요한 상품을 제때 받으려는 수요를 겨냥해 당일·새벽배송과 도착보장 서비스를 확대하는 모습이다. 상품 구색과 가격, 취향에 맞는 추천에 더해 배송 속도와 정확성이 플랫폼의 경쟁 요소로 부상하고 있다.'빨리 받는 옷' 늘리자 브랜드 거래액도 증가9일 카카오스타일에 따르면 지그재그의 올해 상반기 브랜드패션 카테고리 직진배 gy Review", "region": "해외", "published": "2026-09-09 12:10", "published_sort": "2026-09-09T12:10:00+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "AWS, 국내 우주·위성 스타트업 대상 엑셀러레이터 프로그램 실시", "link": "https://www.aitimes.com/news/articleView.html?idxno=215029", "summary": "아마존웹서비스(AWS)는 우주항공청(KASA), 메가존클라우드와 국내 우주·위성 스타트업을 지원하는 'AWS 스페이스 엑셀러레이터: 한국 2026'을 시작한다고 9일 밝혔다.2021년 출범해 6년째를 맞는 이번 프로그램은 4주간 진행되며, 선정 스타트업에는 최대 10만달러 상당의 클라우드 크레딧을 포함해 전문가 기술 멘토링, 우주산업 리더의 비즈니스 코칭, 벤처캐피탈 및 잠재 고객과의 네트워킹 기회가 제공된다.지원 대상은 위성 제조·운영, 지구관측, 발사체, 궤도 서비스, 우주 통신, 우주 분야 AI, 우주 소프트웨어 등이며, 프리", "source": "AI타임스", "region": "국내", "published": "2026-09-09 12:05", "published_sort": "2026-09-09T12:05:50+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "순천, 팔마문화제 12~13일 개최…효린 공연·최태성 토크콘서트", "link": "https://www.aitimes.com/news/articleView.html?idxno=215028", "summary": "AI 생성 영상순천 원도심이 이번 주말 공연과 역사 체험, 전시를 한자리에서 즐기는 축제 공간으로 바뀐다. 가수 효린의 축하공연과 역사강사 최태성의 토크콘서트, 가족 미션투어, 갤러리 스탬프 투어 등이 이틀간 이어진다.순천시는 오는 12일부터 13일까지 남문터광장과 문화의 거리 일원에서 ‘제43회 순천팔마문화제’를 개최한다고 밝혔다.올해 문화제는 ‘팔마정신 : 울림에서 이음으로’를 주제로 청렴과 배려의 가치를 공연·전시·체험 콘텐츠로 풀어낸다. 지역예술인이 직접 무대에 오르고 시민 참여 프로그램을 확대하는 데 초점을 맞췄다.첫날인", "source": "AI타임스", "region": "국내", "published": "2026-09-09 12:04", "published_sort": "2026-09-09T12:04:14+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "목포 북항서 11일 ‘가을밤의 국악대향연’…판소리·검무·남도민요 한자리", "link": "https://www.aitimes.com/news/articleView.html?idxno=215020", "summary": "AI 생성 영상목포 북항 노을공원에서 판소리와 가야금병창, 검무, 남도민요를 한자리에서 즐길 수 있는 야외 국악공연이 열린다.목포시립국악원은 오는 11일 오후 7시 북항 노을공원 야외무대에서 ‘제26회 가을밤의 국악대향연’을 개최한다고 9일 밝혔다.이번 공연은 기악과 민요, 판소리, 무용 등 국악의 여러 장르를 한 무대에서 선보이는 방식으로 구성된다.가야금병창 ‘야월삼경’을 비롯해 ‘군밤타령’ ‘옹헤야’가 무대에 오르고, 역동적인 검무와 목포의 풍경을 담은 신민요 ‘목포팔경’도 선보인다.판소리 춘향가 중 ‘동헌경사대목’과 창작무용", "source": "AI타임스", "region": "국내", "published": "2026-09-09 12:03", "published_sort": "2026-09-09T12:03:53+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "韓 사망 원인 2위 '심장 질환'...'갤럭시워치9', 예방법 알려준다", "link": "https://www.techm.kr/news/articleView.html?idxno=155049", "summary": "\"'갤럭시 워치9'는 나만의 건강을 넘어 가족의 건강을 챙기는 주치의로 진화했다. 특히 심장의 '골든 타임'을 지키는 역할을 강화했다. '갤럭시 워치 시리즈'는 심장 건강뿐 아니라 '예방' 중심 건강 동반자가 되겠다.\"9일 최종민 삼성전자 모바일경험(MX)사업부 디지털헬스팀 상무는 서울 중구 태평로빌딩에서 열린 '갤럭시 워치9 헬스 브리핑'에서 이같이 밝히고 '손목 위의 주치의'의 진료 과목 확대를 소개했다.심장 질환은 세계 최대 사망 원인이다. 전체 사망자의 13%가 심장 질환으로 죽는다. 국내는 죽음을 초래하는 2번째 요인이다.", "source": "테크M", "region": "국내", "published": "2026-09-09 11:30", "published_sort": "2026-09-09T11:30:00+00:00", "collected_at": "2026-09-10 12:24", "tags": ["법규/정책"], "flag": false, "flag_hits": []}, {"title": "[글로벌] AI 데이터센터 확산에 메모리 가격 급등...애플도 가격 인상 압박", "link": "https://www.techm.kr/news/articleView.html?idxno=155022", "summary": "인공지능(AI) 데이터센터 투자 경쟁이 스마트폰과 PC 가격까지 밀어 올리고 있습니다. AI 서버에 들어가는 메모리 수요가 급증하면서 글로벌 메모리 공급이 빠듯해졌고, 애플을 비롯한 전자제품 업체들도 높아진 부품 가격을 피하기 어려워졌습니다.9일 주요 외신들에 따르면 최근 AI 붐으로 메모리 반도체 공급 부족이 심해지면서 소비자 전자제품 가격이 오르는 이른바 'RAMageddon' 현상이 나타나고 있습니다. AI 데이터센터에 막대한 양의 메모리가 투입되면서 그동안 가격이 지속적으로 낮아졌던 PC와 스마트폰 시장에도 변화가 나타나고", "source": "테크M", "region": "국내", "published": "2026-09-09 11:26", "published_sort": "2026-09-09T11:26:42+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "카카오게임즈 하반기 최대 기대작 '도깨비의세계' 10월 8일 출격", "link": "https://www.techm.kr/news/articleView.html?idxno=155050", "summary": "카카오게임즈의 하반기 최대 기대작으로 꼽히는 신작 MMORPG '도깨비의세계'를 내달 8일 정식 출시한다. 한국적 세계관과 독특한 도트 그래픽, 경쟁보다 협력에 초점을 맞춘 성장 구조 등을 앞세워 이용자 확보에 나선다는 전략이다.카카오게임즈는 전날 온라인 쇼케이스를 열고 도깨비의세계의 주요 콘텐츠와 서비스 일정을 공개했다고 9일 밝혔다. 카카오게임즈는 도깨비의세계의 출시일을 내달 8일로 확정하고 남은기간 마케팅에 속도를 낼 방침이다. 온라인 쇼케이스에는 이시우 카카오게임즈 대표와 차명수 사업실장, 장수민 슈퍼캣 디렉터, 박성준 PD", "source": "테크M", "region": "국내", "published": "2026-09-09 11:25", "published_sort": "2026-09-09T11:25:33+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": true, "flag_hits": ["정식 출시"]}, {"title": "'한우·굴비만으론 안 된다'…1700만원 여행·수면체험까지 파는 백화점", "link": "https://www.techm.kr/news/articleView.html?idxno=155048", "summary": "백화점의 명절 선물 공식이 바뀌고 있다. 한우와 과일, 굴비를 앞세우던 전통적인 선물세트에서 벗어나 여행과 예술, 수면·스타일링 등 '경험' 자체를 상품으로 내놓는 사례가 늘고 있다. 가격 비교가 쉬운 일반 상품만으로는 온라인 쇼핑몰과 차별화하기 어렵다는 판단에 따라 백화점이 강점을 가진 큐레이션과 체험을 앞세워 프리미엄 고객을 붙잡는 모습이다.9일 유통업계에 따르면 현대백화점은 올 추석 프리미엄 큐레이션몰 '더현대 하이(Hi)'의 온라인 선물 상품을 지난해 100여개에서 700여개로 7배 늘렸다. 입점 브랜드도 30여개에서 100", "source": "테크M", "region": "국내", "published": "2026-09-09 11:10", "published_sort": "2026-09-09T11:10:02+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "'올리브영 다음은 누구'…무신사·다이소까지 뛰어든 K뷰티 오프라인 전쟁", "link": "https://www.techm.kr/news/articleView.html?idxno=155047", "summary": "K뷰티 열풍이 이어지면서 오프라인 뷰티 유통 시장의 경쟁이 다시 달아오르고 있다. CJ올리브영이 전국 점포망과 외국인 관광객 수요를 앞세워 독주하는 가운데 무신사는 대형 전문매장과 약국 결합 모델로, 다이소는 초저가 화장품과 특화매장으로 틈새를 파고들고 있다. 온라인에서 브랜드를 발굴하던 플랫폼들이 직접 매장을 열기 시작하면서 K뷰티 유통의 주도권 경쟁도 한층 치열해지는 모습이다.9일 유통업계에 따르면 무신사는 오는 11일 서울 홍대에 첫 뷰티 단독 매장 '무신사 뷰티 홍대'를 연다. 지하 1층부터 지상 3층까지 약 400평 규모다", "source": "테크M", "region": "국내", "published": "2026-09-09 11:08", "published_sort": "2026-09-09T11:08:05+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "[테크M 이슈] '동네 장보기' 다시 뜬다…GS더프레시 독주 속 SSM '2위 전쟁' 불붙었다", "link": "https://www.techm.kr/news/articleView.html?idxno=155045", "summary": "기업형 슈퍼마켓(SSM) 시장의 경쟁 구도가 다시 요동치고 있다. 600개가 넘는 점포를 앞세운 GS더프레시가 매출과 수익성을 동시에 끌어올리며 선두를 굳힌 가운데 이마트 에브리데이와 롯데슈퍼가 2위 자리를 놓고 맞붙고 있다. 여기에 하림그룹 품에 안긴 홈플러스 익스프레스가 빠른 속도로 정상화되면서 사실상 4파전 구도가 만들어지고 있다. 대형마트가 고전하는 사이 집 근처 점포와 퀵커머스를 결합한 SSM이 새로운 격전지로 떠오르는 모습이다.9일 유통업계에 따르면 GS더프레시는 올 2분기 매출 4698억원, 영업이익 93억원을 기록했다", "source": "테크M", "region": "국내", "published": "2026-09-09 11:02", "published_sort": "2026-09-09T11:02:30+00:00", "collected_at": "2026-09-10 12:24", "tags": ["기타"], "flag": false, "flag_hits": []}, {"title": "Man told ChatGPT he was feeling delusional. ChatGPT insisted he was Jesus.", "link": "https://arstechnica.com/tech-policy/2026/09/man-told-chatgpt-he-was-feeling-delusional-chatgpt-insisted-he-was-jesus/", "summary": "Man with bipolar disorder sued OpenAI after surviving ChatGPT-linked suicide attempt.", "source": "Ars Technica", "region": "해외", "published": "2026-09-09 11:00", "published_sort": "2026-09-09T11:00:10+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술", "UI/UX"], "flag": false, "flag_hits": []}, {"title": "\"오픈마켓 벗어나니 매출 70%가 자사몰\"…카페24, AI·유튜브로 '성장 공식' 푼다", "link": "https://www.techm.kr/news/articleView.html?idxno=155043", "summary": "카페24가 온라인 사업자들의 매출 성장을 위한 '실전 마케팅' 지원을 강화한다. 인공지능(AI)을 활용한 고객 분석부터 자사몰 전환, 유튜브 쇼핑과 크리에이터 마케팅까지 실제 브랜드의 성공 사례를 한데 모은다. 이커머스 사업자들이 광고비를 투입하는 데 그치지 않고 각자의 상품과 고객에 맞는 판매 전략을 구축하도록 돕겠다는 취지다.9일 카페24에 따르면 오는 17일 오후 2시 서울 강남구 가빈아트홀에서 마케팅 특화 콘퍼런스 '카페24 마케팅 플레이북 2026 Vol.2'를 연다. 지난달 열린 첫 행사에 온라인 사업자 250여명이 몰리", "source": "테크M", "region": "국내", "published": "2026-09-09 10:58", "published_sort": "2026-09-09T10:58:07+00:00", "collected_at": "2026-09-10 12:24", "tags": ["AI/신기술"], "flag": false, "flag_hits": []}, {"title": "\"5원 포인트에 골목상권 흔들\"…소상공인연합회, 토스 '검색 미션' 중단 촉구", "link": "https://www.techm.kr/news/articleView.html?idxno=155044", "summary": "소상공인연합회가 모바일 금융 플랫폼 토스의 '검색 미션'을 두고 소상공인의 영업 기반을 훼손할 수 있다며 전면 중단을 촉구했다. 이용자에게 소액의 포인트를 지급하고 특정 상품이나 매장을 검색하도록 유도하는 과정에서 인위적인 트래픽이 발생해 네이버 검색 순위가 왜곡되고 있다는 주장이다.9일 업계에 따르면 소상공인연합회는 전날 입장문을 내고 토스 운영사 비바리퍼블리카에 '검색 유도형 리워드 미션'을 즉각 중단하라고 요구했다. 사법당국에는 관련 의혹에 대한 엄정한 수사를, 정부와 국회에는 리워드형 검색 서비스에 대한 제도적 보완책 마련을", "source": "테크M", "region": "국내", "published": "2026-09-09 10:56", "published_sort": "2026-09-09T10:56:19+00:00", "collected_at": "2026-09-10 12:24", "tags": ["법규/정책"], "flag": false, "flag_hits": []}, {"title": "헥토파이낸셜, 카페24 쇼핑몰에 '포인트다모아' 제공", "link": "https://www.techm.kr/news/articleView.html?idxno=155042", "summary": "헥토파이낸셜은 전자상거래 플랫폼 카페24 회원사인 온라인 쇼핑몰에 신규 결제수단으로 '포인트다모아' 서비스를 제공한다고 9일 밝혔다.포인트다모아는 여러 카드사에 흩어진 고객의 신용카드 포인트를 한 번 ollected_at": "2026-09-10 12:24", "tags": ["법규/정책", "UI/UX"], "flag": false, "flag_hits": []}];
const PAGE_SIZE = 150;

const TAG_CLASS = {"AI/신기술": "ai", "UI/UX": "uiux", "법규/정책": "law", "기타": "etc"};

let activeCat = "전체";
let activeRegion = null;
let onlyFlag = false;
let shown = PAGE_SIZE;
const searchInput = document.getElementById("search");
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
const moreBtn = document.getElementById("moreBtn");

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    const cat = chip.dataset.cat;
    if (cat === "__flag") {
      onlyFlag = !onlyFlag;
      chip.classList.toggle("active", onlyFlag);
    } else if (cat.startsWith("__")) {
      const region = cat.slice(2);
      if (activeRegion === region) {
        activeRegion = null; chip.classList.remove("active");
      } else {
        document.querySelectorAll(".chip[data-cat^='__'][data-cat!='__flag']").forEach(c => c.classList.remove("active"));
        activeRegion = region; chip.classList.add("active");
      }
    } else {
      document.querySelectorAll(".chip:not([data-cat^='__'])").forEach(c => c.classList.remove("active"));
      activeCat = cat; chip.classList.add("active");
    }
    shown = PAGE_SIZE;
    render();
  });
});

let searchTimer = null;
searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { shown = PAGE_SIZE; render(); }, 150);
});
moreBtn.addEventListener("click", () => { shown += PAGE_SIZE; render(); });

function render() {
  const q = searchInput.value.trim().toLowerCase();
  let rows = DATA.filter(r => activeCat === "전체" || r.tags.includes(activeCat));
  if (activeRegion) rows = rows.filter(r => r.region === activeRegion);
  if (onlyFlag) rows = rows.filter(r => r.flag);
  if (q) rows = rows.filter(r => (r.title + " " + r.summary).toLowerCase().includes(q));

  countEl.textContent = rows.length + "건";
  if (rows.length === 0) {
    listEl.innerHTML = '<div class="empty">해당 조건의 기사가 없습니다.</div>';
    moreBtn.hidden = true;
    return;
  }
  const visible = rows.slice(0, shown);
  listEl.innerHTML = visible.map(r => `
    <div class="card ${r.flag ? 'flagged' : ''}">
      <div class="card-top">
        <div class="card-title">${r.flag ? '<span class="star" title="기획자 주목: ' + escapeHtml((r.flag_hits||[]).join(', ')) + '">★</span>' : ''}<a href="${r.link}" target="_blank" rel="noopener">${escapeHtml(r.title)}</a></div>
        <div class="card-date">${r.published || r.collected_at}</div>
      </div>
      ${r.summary ? `<div class="card-summary">${escapeHtml(r.summary)}</div>` : ""}
      <div class="card-bottom">
        <span class="src">${r.source} · ${r.region}</span>
        ${r.tags.map(t => `<span class="tag ${TAG_CLASS[t] || 'etc'}">${t}</span>`).join("")}
      </div>
    </div>
  `).join("");
  moreBtn.hidden = rows.length <= shown;
  moreBtn.textContent = `더 보기 (${rows.length - shown}건 더 있음)`;
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

render();
</script>
